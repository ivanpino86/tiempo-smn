name: Renovar token SMN

on:
  schedule:
    - cron: "*/40 * * * *"   # cada 40 minutos (el token dura 60)
  workflow_dispatch:          # botón para correrlo a mano

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Imagen oficial de Playwright: trae Chromium y sus librerías del sistema.
    # Debe coincidir con la versión de playwright en requirements.txt.
    container:
      image: mcr.microsoft.com/playwright/python:v1.47.0-noble
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: pip install -r token-refresher/requirements.txt

      - name: Obtener token y enviarlo al proxy
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: python token-refresher/refresh_token.py
