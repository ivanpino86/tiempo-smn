name: Renovar token SMN

on:
  schedule:
    - cron: "*/40 * * * *"   # cada 40 minutos (el token dura 60)
  workflow_dispatch:          # botón para correrlo a mano

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r token-refresher/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Obtener token y enviarlo al proxy
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: python token-refresher/refresh_token.py
